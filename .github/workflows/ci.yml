name: Source and static site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check repository data boundary
        run: python scripts/repo_check.py
      - name: Initialize empty local content
        run: python scripts/setup_local.py
      - name: Install editor image dependency
        run: python -m pip install --requirement requirements-editor.txt
      - name: Build and verify static site
        run: |
          python scripts/build.py
          python scripts/nginx_config.py
          python -I scripts/check.py
      - name: Check browser scripts
        run: |
          node --check assets/site.js
          node --check editor/editor.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify release package in isolation
        run: |
          python scripts/package.py
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, tarfile, tempfile
          with tempfile.TemporaryDirectory() as temp:
              with tarfile.open('artifacts/yangarch-home.tar.gz') as archive:
                  archive.extractall(temp, filter='data')
              subprocess.run([sys.executable, '-I', str(Path(temp) / 'scripts/check.py')], check=True)
          PY
